name: Build Windows Executable (String Art Studio Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon=StringArt.ico --name "StringArtStudioPro" string-art-generator.py

    - name: Package Executable
      run: |
        Compress-Archive -Path dist/StringArtStudioPro/* -DestinationPath StringArtStudioPro-v9.0-Windows.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StringArtStudioPro-v9.0-Windows
        path: StringArtStudioPro-v9.0-Windows.zip
